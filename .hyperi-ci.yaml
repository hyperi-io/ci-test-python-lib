# Library variant — no [project.scripts], no Dockerfile. hyperi-ci's
# container detector classifies this as library-only and skips the
# container build stage entirely. Publish target is PyPI only.

language: python

quality:
  enabled: true

test:
  enabled: true

build:
  enabled: true
  type: package

publish:
  enabled: true
  target: oss
  # No `container:` block — defaults to enabled: auto and the detector
  # short-circuits because the lib has no [project.scripts] entry.
